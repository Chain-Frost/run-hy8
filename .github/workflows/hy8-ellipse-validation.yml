name: HY-8 ellipse validation probe

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch with LFS
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Extract official HY-8 8.0.1.2
        id: hy8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          $outer = Join-Path $env:RUNNER_TEMP "hy8-outer"
          $payload = Join-Path $env:RUNNER_TEMP "hy8-payload"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $setup = Join-Path $outer "HY88.00.2Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $payload + '"'), "/exenoui") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "HY-8 installer extraction failed: $($p.ExitCode)" }
          $exe = Get-ChildItem -Path $payload -Recurse -Filter HY864.exe -File | Select-Object -First 1
          if (-not $exe) { throw "HY864.exe not found" }
          "HY8_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using HY8_EXE=$($exe.FullName)"

      - name: Probe ellipse legacy/state cards
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import shutil
          from pathlib import Path

          from run_hy8 import (
              EllipticalConcreteInlet,
              Hy8Executable,
              Hy8FileWriter,
              parse_rst,
          )
          from tests.test_elliptical import _ellipse_project

          root = Path.cwd() / "ellipse-card-probes"
          root.mkdir(exist_ok=True)

          project = _ellipse_project(span=1.524, rise=0.9652)
          project.crossings[0].culverts[0].inlet_configuration = (
              EllipticalConcreteInlet.SQUARE_EDGE_WITH_HEADWALL
          )
          base = Hy8FileWriter(project).write(root / "base.hy8")
          base_text = base.read_text(encoding="utf-8")

          variants = {
              "current": {},
              "legacy3": {"legacy": 3},
              "imp1": {"imp": 1},
              "legacy3_imp1": {"legacy": 3, "imp": 1},
              "gui_full": {"legacy": 3, "imp": 1, "full": True},
          }

          for name, options in variants.items():
              path = root / f"{name}.hy8"
              text = base_text
              if "legacy" in options:
                  text = text.replace(
                      "INLETEDGETYPE        0",
                      f"INLETEDGETYPE        {options['legacy']}",
                  )
              if "imp" in options:
                  text = text.replace(
                      "IMPINLETEDGETYPE     0",
                      f"IMPINLETEDGETYPE     {options['imp']}",
                  )
              if options.get("full"):
                  text = text.replace(
                      "CULVERTMATERIAL      1\n",
                      "CULVERTMATERIAL      1\n"
                      "LOWERCULVERTMATERIAL 1\n"
                      'LOWERCULVMATSTR      ""\n'
                      "BROKENCULVERT        0\n",
                  )
                  text = text.replace(
                      "IMPINLETEDGETYPE     1\n",
                      "IMPINLETEDGETYPE     1\n"
                      "IMPROVEDINDATA       0.000000   0.000000   0.000000   0.000000   0.000000   0.000000\n",
                  )
                  text = text.replace(
                      "NUMBEROFBARRELS      1\n",
                      "NUMBEROFBARRELS      1\n"
                      "EMBANKDATA           0.000000   0.000000   0.000000   0.000000   0.000000   0.000000\n",
                  )
                  marker = next(line for line in text.splitlines() if line.startswith("INVERTDATA"))
                  text = text.replace(
                      marker + "\n",
                      marker
                      + "\nBREAK                0.000000   0.000000\n"
                      + "UPPERBREAK           0.000000   0.000000\n"
                      + "LOWERBREAK           0.000000   0.000000\n"
                      + "NUMSHAPECOORDS       0\n"
                      + "EMBEDEDGEOMETRY      0\n"
                      + "ENDEMBEDGEOMETRY\n",
                  )
              path.write_text(text, encoding="utf-8")
              Hy8Executable().open_run_save(path)
              rst = parse_rst(path.with_suffix(".rst"))["Sample Crossing"]
              culvert = rst["culverts"][0]
              q_culvert = max(culvert["discharge"], default=float("nan"))
              print(
                  f"PROBE {name}: culvert_max={q_culvert!r}; "
                  f"headwater={rst['headwater']!r}; "
                  f"saved_legacy="
                  f"{next((line for line in path.read_text(encoding='utf-8').splitlines() if line.startswith('INLETEDGETYPE ')), '<missing>')}; "
                  f"saved_imp="
                  f"{next((line for line in path.read_text(encoding='utf-8').splitlines() if line.startswith('IMPINLETEDGETYPE')), '<missing>')}"
              )
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\probe_cards.py"
          python "$env:RUNNER_TEMP\probe_cards.py"
