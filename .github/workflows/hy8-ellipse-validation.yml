name: HY-8 ellipse validation probe

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch with LFS
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Extract official HY-8 8.0.1.2
        id: hy8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          $outer = Join-Path $env:RUNNER_TEMP "hy8-outer"
          $payload = Join-Path $env:RUNNER_TEMP "hy8-payload"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $setup = Join-Path $outer "HY88.00.2Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $payload + '"'), "/exenoui") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "HY-8 installer extraction failed: $($p.ExitCode)" }
          $exe = Get-ChildItem -Path $payload -Recurse -Filter HY864.exe -File | Select-Object -First 1
          if (-not $exe) { throw "HY864.exe not found" }
          "HY8_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using HY8_EXE=$($exe.FullName)"

      - name: Run focused ellipse executable tests
        shell: pwsh
        run: |
          python -m pytest -m requires_hy8 -q tests/test_elliptical.py -vv

      - name: Verify canonical HY-8 ellipse shape code
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          from run_hy8 import Hy8Executable, Hy8FileWriter, parse_rst
          from tests.test_elliptical import _ellipse_project

          root = Path.cwd() / "ellipse-shape-code-probes"
          root.mkdir(exist_ok=True)
          base = Hy8FileWriter(
              _ellipse_project(span=1.524, rise=0.9652)
          ).write(root / "base.hy8")
          base_text = base.read_text(encoding="utf-8")
          hy8 = Hy8Executable()

          for requested_code in range(1, 16):
              path = root / f"shape-{requested_code}.hy8"
              mutated, count = re.subn(
                  r"(?m)^CULVERTSHAPE\s+\d+\s*$",
                  f"CULVERTSHAPE         {requested_code}",
                  base_text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Expected exactly one CULVERTSHAPE card")
              path.write_text(mutated, encoding="utf-8")
              pre_shape = next(
                  line for line in path.read_text(encoding="utf-8").splitlines()
                  if line.startswith("CULVERTSHAPE")
              )
              completed = hy8.open_run_save(path, check=False)
              post_shape = next(
                  (
                      line
                      for line in path.read_text(encoding="utf-8").splitlines()
                      if line.startswith("CULVERTSHAPE")
                  ),
                  "<missing>",
              )
              rst_path = path.with_suffix(".rst")
              max_q = None
              if rst_path.exists():
                  try:
                      series = parse_rst(rst_path)["Sample Crossing"]
                      culverts = series.get("culverts", [])
                      if culverts:
                          max_q = max(culverts[0]["discharge"], default=None)
                  except Exception as exc:
                      max_q = f"parse-error:{exc!r}"
              print(
                  "SHAPE_CANON",
                  f"requested={requested_code}",
                  f"exit={completed.returncode}",
                  f"pre={pre_shape!r}",
                  f"post={post_shape!r}",
                  f"max_q={max_q!r}",
              )
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\shape_code_probe.py"
          python "$env:RUNNER_TEMP\shape_code_probe.py"
