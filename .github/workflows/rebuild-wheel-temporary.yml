name: Temporary wheel regeneration

on:
  push:
    branches: [fix/8-python313-import-compatibility]

permissions:
  contents: write

jobs:
  rebuild-wheel:
    if: github.repository == 'Chain-Frost/run-hy8'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/8-python313-import-compatibility
          persist-credentials: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build current wheel in isolation
        shell: pwsh
        run: |
          python -m pip install build packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit rebuilt wheel to PR branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/run_hy8-2026.10.5.1-py3-none-any.whl
          if (git diff --cached --quiet) {
            Write-Host "Wheel already matches source."
            exit 0
          }
          git commit -m "Refresh retained wheel for Python 3.13 compatibility"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/8-python313-import-compatibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
