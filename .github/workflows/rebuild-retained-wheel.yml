name: Rebuild retained wheel

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-wheel:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Rebuild and verify retained wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build packaging
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git add dist
          git rm ".github/workflows/rebuild-retained-wheel.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild retained wheel after inverse ellipse support"
          git push origin HEAD:feature/issue-5-elliptical-support
