name: Build PR7 wheel artifact

on:
  push:
    branches:
      - automation/pr7-wheel-build-20261008

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        shell: pwsh
        run: python -m pip install build packaging

      - name: Build retained wheel
        shell: pwsh
        run: python scripts/build_library.py --skip-pip

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pr7-wheel
          path: dist/run_hy8-*.whl
          if-no-files-found: error
          retention-days: 1
