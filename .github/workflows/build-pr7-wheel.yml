name: Commit PR7 retained wheel

on:
  push:
    branches:
      - automation/pr7-wheel-build-20261008

permissions:
  contents: write

jobs:
  commit-wheel:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        shell: pwsh
        run: python -m pip install build packaging

      - name: Build and verify retained wheel
        shell: pwsh
        run: python scripts/build_library.py --skip-pip

      - name: Commit verified wheel only
        shell: pwsh
        run: |
          $changes = git status --porcelain
          $unexpected = $changes | Where-Object { $_ -notmatch 'dist/run_hy8-2026\.10\.5\.1-py3-none-any\.whl$' }
          if ($unexpected) {
            Write-Error "Unexpected build changes"
            $unexpected | ForEach-Object { Write-Output $_ }
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/run_hy8-2026.10.5.1-py3-none-any.whl
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Retained wheel already matches source."
            exit 0
          }
          git commit -m "Rebuild retained wheel for ellipse parity"
          git push origin HEAD:feature/issue-5-elliptical-support
