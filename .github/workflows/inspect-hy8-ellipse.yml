name: Inspect HY-8 ellipse metadata

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect ShapeDB and official HY-8 payload
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check h5py
          @'
          from pathlib import Path
          import h5py

          path = Path("reference_docs/ShapeDB.dat")
          with h5py.File(path, "r") as db:
              print("ROOT_KEYS_BEGIN")
              for index, key in enumerate(db.keys()):
                  print(f"{index}: {key}")
              print("ROOT_KEYS_END")
              group = db["Elliptical"]
              print("ELLIPTICAL_BEGIN")
              def visit(name, obj):
                  print("OBJECT", name, type(obj).__name__)
                  for k, v in obj.attrs.items():
                      print("ATTR", name, k, repr(v.tolist() if hasattr(v, "tolist") else v))
                  if isinstance(obj, h5py.Dataset):
                      try:
                          value = obj[()]
                          if hasattr(value, "tolist"):
                              value = value.tolist()
                          print("DATA", name, repr(value))
                      except Exception as exc:
                          print("DATAERR", name, repr(exc))
              group.visititems(visit)
              print("ELLIPTICAL_END")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\inspect.py"
          python "$env:RUNNER_TEMP\inspect.py"

          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          $outer = Join-Path $env:RUNNER_TEMP "outer"
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $setup = Join-Path $outer "HY88.00.2Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $payload + '"'), "/exenoui") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "extract failed $($p.ExitCode)" }

          Write-Host "PAYLOAD_MATCHES_BEGIN"
          Get-ChildItem -Path $payload -Recurse -File |
            Where-Object { $_.Extension -in ".dll",".exe",".xml",".config",".pdf" } |
            Select-Object -ExpandProperty FullName
          Write-Host "PAYLOAD_MATCHES_END"

          $strings = @(
            "Elliptical",
            "CULVERTSHAPE",
            "Concrete Box",
            "Pipe Arch"
          )
          foreach ($file in Get-ChildItem -Path $payload -Recurse -File | Where-Object { $_.Extension -in ".dll",".exe" }) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
              if ($ascii.Contains("Elliptical")) {
                Write-Host "ELLIPTICAL_BINARY $($file.FullName)"
                foreach ($needle in $strings) {
                  if ($ascii.Contains($needle)) { Write-Host "  HAS $needle" }
                }
              }
            } catch {}
          }

          python -m pip install -e .
          @'
          from pathlib import Path
          import math
          import os
          from tests.test_elliptical import _ellipse_project
          from run_hy8 import Hy8FileWriter

          out = Path(os.environ["RUNNER_TEMP"]) / "ellipse-area-probe.hy8"
          project = _ellipse_project(span=1.524, rise=0.9652)
          Hy8FileWriter(project).write(out)
          text = out.read_text(encoding="utf-8")
          span_ft = 1.524 / 0.3048
          rise_ft = 0.9652 / 0.3048
          area_ft2 = math.pi * span_ft * rise_ft / 4.0
          needle = "BARRELDATA"
          lines = text.splitlines()
          updated = []
          inserted = False
          for line in lines:
              updated.append(line)
              if line.startswith(needle):
                  updated.append(
                      f"BARRELGEOMETRY       0.000000   0.000000   0.000000   0.000000   {area_ft2:.6f}"
                  )
                  inserted = True
          if not inserted:
              raise RuntimeError("BARRELDATA not found")
          out.write_text("\n".join(updated) + "\n", encoding="utf-8")
          print("AREA_PROBE_FILE", out)
          print("AREA_FT2", f"{area_ft2:.6f}")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\make_area_probe.py"
          python "$env:RUNNER_TEMP\make_area_probe.py"

          $hy8 = Get-ChildItem -Path $payload -Recurse -Filter HY864.exe -File | Select-Object -First 1
          $probe = Join-Path $env:RUNNER_TEMP "ellipse-area-probe.hy8"
          Push-Location $hy8.DirectoryName
          try {
            $run = Start-Process -FilePath $hy8.FullName -ArgumentList @("-OpenRunSave", ('"' + $probe + '"')) -Wait -PassThru
            Write-Host "AREA_PROBE_EXIT $($run.ExitCode)"
          } finally {
            Pop-Location
          }
          python -c "from pathlib import Path; from run_hy8 import parse_rst; p=Path(r'$env:RUNNER_TEMP')/'ellipse-area-probe.rst'; print('AREA_PROBE_RST', p.exists()); print('AREA_PROBE_RESULTS', parse_rst(p) if p.exists() else None)"
