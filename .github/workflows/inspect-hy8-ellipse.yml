name: Inspect HY-8 ellipse metadata

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect ShapeDB and official HY-8 payload
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check h5py
          @'
          from pathlib import Path
          import h5py

          path = Path("reference_docs/ShapeDB.dat")
          with h5py.File(path, "r") as db:
              print("ROOT_KEYS_BEGIN")
              for index, key in enumerate(db.keys()):
                  print(f"{index}: {key}")
              print("ROOT_KEYS_END")
              group = db["Elliptical"]
              print("ELLIPTICAL_BEGIN")
              def visit(name, obj):
                  print("OBJECT", name, type(obj).__name__)
                  for k, v in obj.attrs.items():
                      print("ATTR", name, k, repr(v.tolist() if hasattr(v, "tolist") else v))
                  if isinstance(obj, h5py.Dataset):
                      try:
                          value = obj[()]
                          if hasattr(value, "tolist"):
                              value = value.tolist()
                          print("DATA", name, repr(value))
                      except Exception as exc:
                          print("DATAERR", name, repr(exc))
              group.visititems(visit)
              print("ELLIPTICAL_END")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\inspect.py"
          python "$env:RUNNER_TEMP\inspect.py"

          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          $outer = Join-Path $env:RUNNER_TEMP "outer"
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $setup = Join-Path $outer "HY88.00.2Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $payload + '"'), "/exenoui") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "extract failed $($p.ExitCode)" }

          Write-Host "PAYLOAD_MATCHES_BEGIN"
          Get-ChildItem -Path $payload -Recurse -File |
            Where-Object { $_.Extension -in ".dll",".exe",".xml",".config",".pdf" } |
            Select-Object -ExpandProperty FullName
          Write-Host "PAYLOAD_MATCHES_END"

          $strings = @(
            "Elliptical",
            "CULVERTSHAPE",
            "Concrete Box",
            "Pipe Arch"
          )
          foreach ($file in Get-ChildItem -Path $payload -Recurse -File | Where-Object { $_.Extension -in ".dll",".exe" }) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
              if ($ascii.Contains("Elliptical")) {
                Write-Host "ELLIPTICAL_BINARY $($file.FullName)"
                foreach ($needle in $strings) {
                  if ($ascii.Contains($needle)) { Write-Host "  HAS $needle" }
                }
              }
            } catch {}
          }
