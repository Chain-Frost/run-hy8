name: Diagnose GUI ellipse contract

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/issue-5-elliptical-support'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-5-elliptical-support
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Extract official HY-8 8.0.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          $outer = Join-Path $env:RUNNER_TEMP "hy8-outer"
          $payload = Join-Path $env:RUNNER_TEMP "hy8-payload"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $setup = Join-Path $outer "HY88.00.2Setup.exe"
          $extract = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $payload + '"'), "/exenoui") -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw "HY-8 installer extraction failed: $($extract.ExitCode)" }
          $exe = Get-ChildItem -Path $payload -Recurse -Filter HY864.exe -File | Select-Object -First 1
          if (-not $exe) { throw "HY864.exe not found" }
          "RUN_HY8_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compare GUI fixture with catalogue-backed mutations
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import math
          import os
          import re
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          from run_hy8 import Hy8Executable, Hy8FileWriter, parse_rst
          from tests.test_elliptical import _ellipse_project

          root = Path.cwd()
          fixture = root / "reference_docs" / "example-ellipse.hy8"
          work = Path(os.environ["RUNNER_TEMP"]) / "ellipse-gui-contract"
          work.mkdir(parents=True, exist_ok=True)
          hy8 = Hy8Executable(exe_path=Path(os.environ["RUN_HY8_EXE"]))

          CARD_PREFIXES = (
              "CULVERTSHAPE",
              "CULVERTMATERIAL",
              "LOWERCULVERTMATERIAL",
              "BROKENCULVERT",
              "INLETTYPE",
              "INLETEDGETYPE",
              "INLETEDGETYPE71",
              "IMPINLETEDGETYPE",
              "BARRELDATA",
              "LOWERCULVERTMANNING",
              "LOWERCULVERTMANNINGB",
              "IRREGSIZE",
              "EMBEDDEPTH",
              "BARRELGEOMETRY",
              "EMBANKMENTTYPE",
              "NUMBEROFBARRELS",
              "INVERTDATA",
          )

          def report(path: Path) -> tuple[int, float | None]:
              completed = hy8.open_run_save(path, check=False)
              rst = path.with_suffix(".rst")
              max_q = None
              if rst.exists():
                  try:
                      parsed = parse_rst(rst)
                      if parsed:
                          series = next(iter(parsed.values()))
                          culverts = series.get("culverts", [])
                          if culverts:
                              values = culverts[0]["discharge"]
                              finite = [value for value in values if math.isfinite(value)]
                              if finite:
                                  max_q = max(finite)
                  except Exception as exc:
                      print("PARSE_ERROR", path.name, repr(exc))
              print("CASE", path.stem, "exit", completed.returncode, "max_q", max_q)
              if path.exists():
                  for line in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                      if line.startswith(CARD_PREFIXES):
                          print("CARD", path.stem, line)
              return completed.returncode, max_q

          def mutate(
              source_text: str,
              name: str,
              transforms: list[tuple[str, str]],
          ) -> Path:
              text = source_text
              for pattern, replacement in transforms:
                  text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
                  if count != 1:
                      raise RuntimeError(f"{name}: expected one match for {pattern!r}, got {count}")
              path = work / f"{name}.hy8"
              path.write_text(text, encoding="utf-8")
              return path

          # Authoritative GUI-created Steel or Aluminum catalogue selection:
          # 241 in x 156 in, ShapeDB row index 1.
          gui = work / "gui-base.hy8"
          shutil.copy2(fixture, gui)
          report(gui)
          gui_text = fixture.read_text(encoding="utf-8")

          report(
              mutate(
                  gui_text,
                  "gui-irregsize-zero",
                  [(r"^IRREGSIZE\s+.*$", "IRREGSIZE            0 0 0")],
              )
          )
          report(
              mutate(
                  gui_text,
                  "gui-geometry-zero",
                  [
                      (
                          r"^BARRELGEOMETRY\s+.*$",
                          "BARRELGEOMETRY       0.000000   0.000000   0.000000   0.000000   0.000000",
                      )
                  ],
              )
          )
          report(
              mutate(
                  gui_text,
                  "gui-catalogue-area",
                  [
                      (
                          r"^BARRELGEOMETRY\s+.*$",
                          "BARRELGEOMETRY       13.083333  13.083333  4.500000   6.500000   201.850006",
                      )
                  ],
              )
          )
          report(
              mutate(
                  gui_text,
                  "gui-legacy-inlet-zero",
                  [
                      (r"^INLETEDGETYPE\s+\d+\s*$", "INLETEDGETYPE        0"),
                      (r"^IMPINLETEDGETYPE\s+\d+\s*$", "IMPINLETEDGETYPE     0"),
                  ],
              )
          )

          # Concrete catalogue row 8: 60 in x 38 in.
          project = _ellipse_project(span=1.524, rise=0.9652)
          generated = Hy8FileWriter(project).write(work / "concrete-generated.hy8")
          generated_text = generated.read_text(encoding="utf-8")
          report(generated)

          material2 = [(r"^CULVERTMATERIAL\s+\d+\s*$", "CULVERTMATERIAL      2")]
          report(mutate(generated_text, "concrete-material2", material2))
          report(
              mutate(
                  generated_text,
                  "concrete-material2-irreg1",
                  [
                      *material2,
                      (r"^IRREGSIZE\s+.*$", "IRREGSIZE            0 0 1"),
                  ],
              )
          )
          report(
              mutate(
                  generated_text,
                  "concrete-catalogue-geometry",
                  [
                      *material2,
                      (r"^IRREGSIZE\s+.*$", "IRREGSIZE            0 0 1"),
                      (
                          r"^BARRELGEOMETRY\s+.*$",
                          "BARRELGEOMETRY       4.300000   4.300000   1.369167   1.583333   12.850000",
                      ),
                  ],
              )
          )
          report(
              mutate(
                  generated_text,
                  "concrete-catalogue-gui-flags",
                  [
                      *material2,
                      (r"^INLETEDGETYPE\s+\d+\s*$", "INLETEDGETYPE        1"),
                      (r"^IMPINLETEDGETYPE\s+\d+\s*$", "IMPINLETEDGETYPE     1"),
                      (r"^IRREGSIZE\s+.*$", "IRREGSIZE            0 0 1"),
                      (
                          r"^BARRELGEOMETRY\s+.*$",
                          "BARRELGEOMETRY       4.300000   4.300000   1.369167   1.583333   12.850000",
                      ),
                  ],
              )
          )
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\diagnose_gui_ellipse.py"
          python "$env:RUNNER_TEMP\diagnose_gui_ellipse.py"
