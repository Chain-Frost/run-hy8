name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        shell: pwsh
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        shell: pwsh
        run: pyright src/run_hy8

      - name: Test
        shell: pwsh
        run: python -m pytest --cov=src/run_hy8 --cov-report=xml

      - name: Verify retained package artifact
        shell: pwsh
        run: python scripts/verify_wheel.py

      - name: Verify package artifacts
        shell: pwsh
        run: |
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_test_installed_wheel.py


  shape-db-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout run-hy8
        uses: actions/checkout@v4

      - name: Checkout pinned reference repository with LFS
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/ryan-culverts
          ref: 662eae7e07eab540c015bc72f194a206dbdef5da
          path: reference-ryan-culverts
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inspect HY-8 ShapeDB ellipse metadata
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check h5py
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          import h5py

          path = Path("reference-ryan-culverts/reference_docs/ShapeDB.dat")
          data = path.read_bytes()
          print(f"SHAPEDB_SHA256={hashlib.sha256(data).hexdigest()}")
          print(f"SHAPEDB_SIZE={len(data)}")

          def display(value: object) -> object:
              if hasattr(value, "tolist"):
                  value = value.tolist()
              if isinstance(value, bytes):
                  return value.decode("utf-8", errors="replace")
              if isinstance(value, list):
                  return [display(item) for item in value]
              return value

          with h5py.File(path, "r") as database:
              print("ROOT_KEYS=" + repr(list(database.keys())))

              def visitor(name: str, obj: h5py.Group | h5py.Dataset) -> None:
                  if "ellipt" not in name.casefold() and name.count("/") == 0:
                      return
                  print(f"OBJECT {name} TYPE={type(obj).__name__}")
                  for key, value in obj.attrs.items():
                      print(f"  ATTR {key}={display(value)!r}")
                  if isinstance(obj, h5py.Dataset):
                      try:
                          print(f"  DATA={display(obj[()])!r}")
                      except Exception as exc:
                          print(f"  DATA_ERROR={exc!r}")

              database.visititems(visitor)

              print("SHAPE_IDENTIFIER_EVIDENCE_BEGIN")
              for key in ("Shape Names", "File Type", "File Version"):
                  obj = database.get(key)
                  if obj is not None:
                      try:
                          print(f"ROOT_DATASET {key}={display(obj[()])!r}")
                      except Exception as exc:
                          print(f"ROOT_DATASET_ERROR {key}={exc!r}")
              for key, value in database.attrs.items():
                  print(f"ROOT_ATTR {key}={display(value)!r}")
              for shape_name in database.keys():
                  obj = database.get(shape_name)
                  if isinstance(obj, h5py.Group):
                      for key, value in obj.attrs.items():
                          print(f"TOP_GROUP_ATTR {shape_name}/{key}={display(value)!r}")

              def identifier_visitor(name: str, obj: h5py.Group | h5py.Dataset) -> None:
                  leaf = name.rsplit("/", 1)[-1].casefold()
                  if not any(token in leaf for token in ("shape", "code", "index", "number", "type", "id")):
                      return
                  if isinstance(obj, h5py.Dataset):
                      try:
                          value = obj[()]
                          size = getattr(value, "size", 1)
                          if size <= 100:
                              print(f"IDENTIFIER_DATASET {name}={display(value)!r}")
                      except Exception as exc:
                          print(f"IDENTIFIER_DATASET_ERROR {name}={exc!r}")

              database.visititems(identifier_visitor)
              print("SHAPE_IDENTIFIER_EVIDENCE_END")

              ellipse = database.get("Elliptical")
              if ellipse is not None:
                  print("ELLIPTICAL_TREE_BEGIN")
                  ellipse.visititems(lambda name, obj: visitor(f"Elliptical/{name}", obj))
                  print("ELLIPTICAL_TREE_END")
          PY

      - name: Inspect official HY-8 8.0.1.2 package for project evidence
        shell: bash
        run: |
          curl --fail --location --retry 2 --output hy8-8.0.1.2.zip \
            https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip
          python -c "import zipfile; zipfile.ZipFile('hy8-8.0.1.2.zip').extractall('official-hy8')"
          setup="official-hy8/HY88.00.2Setup.exe"
          file "$setup" || true
          echo "SETUP_SIGNATURE_STRINGS_BEGIN"
          strings -a "$setup" | grep -Ei "inno|nullsoft|nsis|installshield|advanced installer|wix|msiexec|hy864|shapedb|culvertshape" | head -200 || true
          strings -el "$setup" | grep -Ei "inno|nullsoft|nsis|installshield|advanced installer|wix|msiexec|hy864|shapedb|culvertshape" | head -200 || true
          echo "SETUP_SIGNATURE_STRINGS_END"
          python -m pip install --disable-pip-version-check pefile
          python -c "import pathlib,pefile,sys; p=pathlib.Path(sys.argv[1]); pe=pefile.PE(str(p),fast_load=True); o=pe.get_overlay_data_start_offset(); print(f'PE_OVERLAY_OFFSET={o}'); data=p.read_bytes()[o:] if o is not None else b''; pathlib.Path('setup-overlay.bin').write_bytes(data); print(f'PE_OVERLAY_SIZE={len(data)}')" "$setup"
          file setup-overlay.bin || true
          echo "OVERLAY_ARCHIVE_LIST_BEGIN"
          7z l setup-overlay.bin 2>/dev/null | head -240 || true
          echo "OVERLAY_ARCHIVE_LIST_END"
          rm -rf official-extracted
          mkdir -p official-extracted
          7z x "$setup" -oofficial-extracted -y >/tmp/hy8-setup-extract.log 2>&1 || true
          echo "SETUP_EXTRACT_MATCHES_BEGIN"
          find official-extracted -type f | grep -Ei "hy8|dat|dll|exe|msi|cab" | head -300 || true
          echo "SETUP_EXTRACT_MATCHES_END"
          grep -RIna --binary-files=without-match "CULVERTSHAPE" official-extracted | head -100 || true


  hy8-windows-package-probe:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout run-hy8
        uses: actions/checkout@v4

      - name: Extract official HY-8 8.0.1.2 package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "hy8.zip"
          Invoke-WebRequest -Uri "https://www.fhwa.dot.gov/engineering/hydraulics/software/hy8/HY88.00.2Setup.zip" -OutFile $zip
          $outer = Join-Path $env:RUNNER_TEMP "hy8-outer"
          Expand-Archive -Path $zip -DestinationPath $outer -Force
          $setup = Join-Path $outer "HY88.00.2Setup.exe"

          $msiDir = Join-Path $env:RUNNER_TEMP "hy8-msi"
          New-Item -ItemType Directory -Path $msiDir -Force | Out-Null
          $p = Start-Process -FilePath $setup -ArgumentList @("/extract", ('"' + $msiDir + '"'), "/exenoui") -Wait -PassThru
          Write-Host "EXTRACT_EXIT=$($p.ExitCode)"
          Write-Host "EXTRACTED_BOOTSTRAPPER_FILES_BEGIN"
          Get-ChildItem -Path $msiDir -Recurse -File | ForEach-Object { $_.FullName }
          Write-Host "EXTRACTED_BOOTSTRAPPER_FILES_END"

          $admin = Join-Path $env:RUNNER_TEMP "hy8-admin"
          New-Item -ItemType Directory -Path $admin -Force | Out-Null
          $msis = @(Get-ChildItem -Path $msiDir -Recurse -Filter *.msi -File)
          Write-Host "MSI_COUNT=$($msis.Count)"
          foreach ($msi in $msis) {
            Write-Host "MSI=$($msi.FullName)"
            $args = @("/a", ('"' + $msi.FullName + '"'), "/qn", ('TARGETDIR="' + $admin + '"'))
            $q = Start-Process -FilePath "msiexec.exe" -ArgumentList $args -Wait -PassThru
            Write-Host "MSI_ADMIN_EXIT=$($q.ExitCode)"
          }

          Write-Host "ADMIN_FILES_BEGIN"
          Get-ChildItem -Path $admin -Recurse -File | ForEach-Object { $_.FullName }
          Write-Host "ADMIN_FILES_END"
          $hy8exe = Get-ChildItem -Path $admin -Recurse -Filter HY864.exe -File | Select-Object -First 1
          $shapeDb = Get-ChildItem -Path $admin -Recurse -Filter ShapeDB.dat -File | Select-Object -First 1
          if ($hy8exe) { Write-Host "HY8_EXE=$($hy8exe.FullName)" }
          if ($shapeDb) {
            Write-Host "SHAPEDB_PATH=$($shapeDb.FullName)"
            Write-Host "SHAPEDB_SHA256=$((Get-FileHash -Path $shapeDb.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          if (-not $hy8exe) { throw "HY864.exe was not extracted from the official package." }

          $baselinePath = (Resolve-Path "tests/example_crossings.hy8").Path
          $baselineCopy = Join-Path (Get-Location) "baseline.hy8"
          Copy-Item $baselinePath $baselineCopy
          Push-Location $admin
          try {
            & $hy8exe.FullName -OpenRunSave $baselineCopy
            Write-Host "BASELINE_EXIT=$LASTEXITCODE"
          }
          finally {
            Pop-Location
          }
          Write-Host "BASELINE_RST_EXISTS=$(Test-Path 'baseline.rst')"
          Write-Host "BASELINE_RSQL_EXISTS=$(Test-Path 'baseline.rsql')"
          if (-not (Test-Path "baseline.rst")) { throw "Known-good HY-8 project did not create baseline.rst." }

          @'
          from __future__ import annotations

          import re
          from pathlib import Path

          source = Path("tests/example_crossings.hy8").read_text(encoding="utf-8")
          pattern = re.compile(
              r'(STARTCROSSING\s+"RCP 900x10 outlet".*?ENDCROSSING\s+"RCP 900x10 outlet")',
              re.DOTALL,
          )
          match = pattern.search(source)
          if match is None:
              raise SystemExit("Reference crossing not found")

          def make_case(name: str, span_ft: float, rise_ft: float) -> None:
              block = match.group(1)
              block = block.replace("RCP 900x10 outlet", name)
              block = re.sub(r"(?m)^CULVERTSHAPE\s+1\s*$", "CULVERTSHAPE         3", block, count=1)
              block = re.sub(
                  r"(?m)^BARRELDATA\s+[^\r\n]+$",
                  f"BARRELDATA           {span_ft:.6f}   {rise_ft:.6f}   0.012000   0.012000",
                  block,
                  count=1,
              )
              project = pattern.sub(block, source, count=1)
              Path(f"{name}.hy8").write_text(project, encoding="utf-8")

          make_case("ellipse_horizontal_60x38", 5.0, 38.0 / 12.0)
          make_case("ellipse_vertical_38x60", 38.0 / 12.0, 5.0)
          '@ | python -

          foreach ($name in @("ellipse_horizontal_60x38", "ellipse_vertical_38x60")) {
            $project = (Resolve-Path "$name.hy8").Path
            Write-Host "PROBE_BEGIN=$name"
            Push-Location $admin
            try {
              & $hy8exe.FullName -OpenRunSave $project
              $exit = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
            Write-Host "HY8_EXIT=$exit"
            Write-Host "RST_EXISTS=$([IO.File]::Exists([IO.Path]::ChangeExtension($project, '.rst')))"
            Write-Host "RSQL_EXISTS=$([IO.File]::Exists([IO.Path]::ChangeExtension($project, '.rsql')))"
            $text = Get-Content -Raw -Path $project
            $m = [regex]::Match(
              $text,
              'STARTCROSSING\s+"' + [regex]::Escape($name) + '".*?ENDCROSSING\s+"' + [regex]::Escape($name) + '"',
              [Text.RegularExpressions.RegexOptions]::Singleline
            )
            if ($m.Success) {
              $m.Value -split "\r?\n" |
                Where-Object { $_ -match '^(CULVERTSHAPE|CULVERTMATERIAL|INLETEDGETYPE71|BARRELDATA)' } |
                ForEach-Object { Write-Host "SAVED_CARD $_" }
            }
            $rst = [IO.Path]::ChangeExtension($project, ".rst")
            if (Test-Path $rst) {
              Select-String -Path $rst -Pattern "Ellipt|Pipe.Arch|Culvert Shape|Culvert Summary|Flow Type" |
                Select-Object -First 80 |
                ForEach-Object { Write-Host "RST_EVIDENCE $($_.Line)" }
            }
            Write-Host "PROBE_END=$name"
          }
