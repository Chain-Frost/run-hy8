name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python313-compat:
    name: Python 3.13 compatibility
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify source compiles on Python 3.13
        shell: pwsh
        run: |
          python -m compileall -q src/run_hy8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install package and pytest
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Python 3.13 import
        shell: pwsh
        run: |
          python -c "import run_hy8; from run_hy8.reader import load_project_from_hy8; print('run_hy8 Python 3.13 import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python 3.13 regression tests
        shell: pwsh
        run: |
          python -m pytest -m "not requires_hy8 and not legacy_parity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        shell: pwsh
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        shell: pwsh
        run: pyright src/run_hy8

      - name: Test
        shell: pwsh
        run: python -m pytest --cov=src/run_hy8 --cov-report=xml

      - name: Verify retained package artifact
        shell: pwsh
        run: python scripts/verify_wheel.py

      - name: Verify package artifacts
        shell: pwsh
        run: |
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_test_installed_wheel.py
