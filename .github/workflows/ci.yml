name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        shell: pwsh
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        shell: pwsh
        run: pyright src/run_hy8

      - name: Test
        shell: pwsh
        run: python -m pytest --cov=src/run_hy8 --cov-report=xml

      # Temporary packaging repair step, removed immediately after wheel commit.
      - name: Refresh retained wheel for existing PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/run_hy8-2026.10.5.1-py3-none-any.whl
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Rebuild retained wheel after ellipse review fixes'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify retained package artifact
        shell: pwsh
        run: python scripts/verify_wheel.py

      - name: Verify package artifacts
        shell: pwsh
        run: |
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_test_installed_wheel.py
