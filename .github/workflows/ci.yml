name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify pinned ShapeDB reference
        shell: pwsh
        run: |
          $path = "reference_docs/ShapeDB.dat"
          if (-not (Test-Path $path)) { throw "ShapeDB.dat was not materialized by Git LFS." }
          $size = (Get-Item $path).Length
          if ($size -ne 4370624) { throw "Unexpected ShapeDB.dat size: $size" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "2479e9444feaff529313e18a1b26fc2de4f6b6c541db58477da6bebc602164a7") {
            throw "Unexpected ShapeDB.dat SHA-256: $hash"
          }

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        shell: pwsh
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        shell: pwsh
        run: pyright src/run_hy8

      - name: Test
        shell: pwsh
        run: python -m pytest --cov=src/run_hy8 --cov-report=xml

      - name: Verify retained package artifact
        shell: pwsh
        run: python scripts/verify_wheel.py

      - name: Verify package artifacts
        shell: pwsh
        run: |
          python scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_test_installed_wheel.py
